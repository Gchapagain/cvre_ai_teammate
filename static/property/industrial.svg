  <g fill="#e8f0ec" stroke="#1d3c2f" stroke-width="2">
    <rect x="70" y="128" width="40" height="50"/><rect x="124" y="128" width="40" height="50"/>
    <rect x="178" y="128" width="40" height="50"/><rect x="232" y="128" width="40" height="50"/>
  </g>
  <g stroke="#9fbcaa" stroke-width="2"><path d="M72 140 H108 M72 152 H108 M72 164 H108 M126 140 H162 M126 152 H162 M126 164 H162 M180 140 H216 M180 152 H216 M180 164 H216 M234 140 H270 M234 152 H270 M234 164 H270"/></g>
  <!-- office corner -->
  <rect x="286" y="118" width="42" height="60" fill="#1d3c2f"/>
  <rect x="294" y="128" width="26" height="14" fill="#c9a227"/><rect x="294" y="150" width="26" height="14" fill="#c9a227" opacity="0.7"/>
  <rect x="40" y="178" width="300" height="6" fill="#13271e"/>
  <!-- truck -->
  <rect x="346" y="150" width="38" height="24" rx="3" fill="#c9a227"/><rect x="384" y="158" width="12" height="16" rx="2" fill="#1d3c2f"/>
  <circle cx="356" cy="178" r="5" fill="#13271e"/><circle cx="388" cy="178" r="5" fill="#13271e"/>
