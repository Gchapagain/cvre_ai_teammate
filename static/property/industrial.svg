<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Illustration of an industrial warehouse">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0ec"/><stop offset="1" stop-color="#f7f3e3"/></linearGradient></defs>
  <rect width="400" height="220" fill="url(#sky)"/>
  <circle cx="330" cy="52" r="20" fill="#c9a227" opacity="0.85"/>
  <path d="M0 168 Q 80 150 160 162 T 400 156 V220 H0Z" fill="#cfe0d6"/>
  <!-- warehouse body with a sawtooth roof -->
  <path d="M48 96 L88 72 L88 96 L128 72 L128 96 L168 72 L168 96 L208 72 L208 96 L248 72 L248 96 L288 72 L288 96 L328 72 L328 178 L48 178 Z" fill="#30654f"/>
